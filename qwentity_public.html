<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qwentity</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600&family=JetBrains+Mono&display=swap">
<style>
:root{
  --bg:#0b1014; --panel:#121a20; --line:#20303a; --fg:#e4eef2; --muted:#7f97a3;
  --core:#4fd6e8; --core-dim:#1d5560; --user:#1a2832; --warn:#f0b35a; --rec:#ff5a6a;
  --f-display:"Unbounded","Trebuchet MS",sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5}
.app{height:100%;display:flex;flex-direction:column;max-width:780px;margin:0 auto;padding:12px 16px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
h1{font-family:var(--f-display);font-size:20px;letter-spacing:.05em;margin:0;flex:1}
.status{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.btn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;cursor:pointer}
.btn[aria-pressed="true"]{color:var(--core);border-color:var(--core-dim)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--core);outline-offset:2px}

#settings{display:grid;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
#settings label{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:grid;gap:4px}
#settings input,#settings textarea,#settings select{width:100%;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit;font-size:15px;text-transform:none;letter-spacing:0}
#settings label.chk{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-family:var(--f-body);font-size:14px;color:var(--fg)}
#settings input[type=checkbox]{width:18px;height:18px;flex:none;accent-color:var(--core)}
#settings textarea{min-height:70px;resize:vertical}
#settings a{color:var(--core)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.row{grid-template-columns:1fr}}

#log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:16px 0}
.msg{max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg .who{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.msg.j{align-self:flex-start;padding-left:14px;border-left:2px solid var(--core-dim)}
.msg.u{align-self:flex-end;background:var(--user);border-radius:14px 14px 4px 14px;padding:10px 14px}
.msg.err{color:var(--warn)}
.src{display:block;margin-top:6px;font-size:13px;color:var(--muted)}
.src a{color:var(--core)}

.mic-zone{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0 6px;border-top:1px solid var(--line)}
#mic{width:96px;height:96px;border-radius:50%;border:0;cursor:pointer;position:relative;
  background:radial-gradient(circle,var(--core) 0 22%,var(--core-dim) 23% 46%,var(--panel) 47%);
  box-shadow:0 0 0 2px var(--core-dim)}
#mic.listening{background:radial-gradient(circle,var(--rec) 0 22%,#5a1d25 23% 46%,var(--panel) 47%);box-shadow:0 0 0 2px var(--rec)}
#mic.busy::after,#mic.listening::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid currentColor;animation:p 1.2s ease-in-out infinite}
#mic.busy{color:var(--core)} #mic.listening{color:var(--rec)}
@keyframes p{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(1.1);opacity:.9}}
@media (prefers-reduced-motion:reduce){#mic::after{animation:none!important}}
#interim{min-height:1.5em;color:var(--muted);font-size:15px;text-align:center}
.text-row{display:flex;gap:8px;width:100%}
#q{flex:1;min-width:0;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
#send.stop{background:var(--warn)}
#send{background:var(--core);color:var(--bg);border:0;border-radius:10px;padding:10px 14px;font-family:var(--f-display);font-size:13px;cursor:pointer}

.mic-langs{display:flex;gap:4px}
.mic-langs button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:3px 8px;font-family:var(--f-mono);font-size:11px;cursor:pointer}
.mic-langs button[aria-pressed="true"]{color:var(--bg);background:var(--core);border-color:var(--core)}
/* ответы с Markdown */
.msg .body{display:block}
.md{white-space:normal}
.md p{margin:0 0 .55em}
.md ul,.md ol{margin:.2em 0 .6em;padding-left:1.3em}
.md li{margin:.15em 0}
.md h4{margin:.7em 0 .3em;font-family:var(--f-display);font-size:14px;letter-spacing:.03em}
.md code{font-family:var(--f-mono);font-size:.88em;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.md .tbl{overflow-x:auto;margin:.4em 0 .7em}
.md table{border-collapse:collapse;font-size:14px}
.md th,.md td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.md th{background:var(--panel);font-weight:600}
.md blockquote{margin:.4em 0;padding-left:10px;border-left:2px solid var(--core-dim);color:var(--muted)}
.md a{color:var(--core)}
.md hr{border:0;border-top:1px solid var(--line);margin:.6em 0}
/* вложения */
#attachBtn{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:0 12px;font-size:17px;cursor:pointer;flex:none}
#attachBtn:hover{border-color:var(--core-dim)}
#tray{display:flex;flex-wrap:wrap;gap:8px;width:100%;padding:4px 0}
.att{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 6px 4px 4px;font-size:12px;color:var(--muted);max-width:220px}
.att img{width:40px;height:40px;object-fit:cover;border-radius:6px;display:block}
.att .ic2{width:40px;height:40px;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;color:var(--core);border:1px solid var(--core-dim);border-radius:6px}
.att span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.att button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 4px}
.msg .atts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.msg .atts img{max-width:160px;max-height:160px;border-radius:8px;display:block}
body.dragging .app{outline:2px dashed var(--core);outline-offset:-6px}
/* запуск кода, Wokwi */
.fv-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.file-view .dl2.alt{background:none;border:1px solid var(--core-dim);color:var(--core)}
.dl2:disabled{opacity:.5;cursor:default}
#pyOut{align-self:stretch;margin:6px 0 0;max-height:45vh;overflow:auto;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--f-mono);font-size:12.5px;white-space:pre-wrap;color:var(--fg)}
.file-view{justify-content:flex-start;padding-top:40px;overflow:auto}
/* экспорт чатов */
.drawer-foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
#importNote{font-size:12px;color:var(--muted);width:100%}
#teachBtn[aria-pressed="true"]{color:var(--bg);background:var(--core);border-color:var(--core)}
/* что сейчас работает */
.trace{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.trace .run{color:var(--core)} .trace .ok{color:#6fd39a} .trace .err{color:var(--warn)}
.health{display:flex;gap:10px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.health span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--line);vertical-align:0}
.health .ok::before{background:#6fd39a} .health .err::before{background:var(--warn)} .health .run::before{background:var(--core)}
/* список чатов */
#drawer{position:fixed;top:0;left:0;bottom:0;width:min(300px,86vw);background:var(--panel);border-right:1px solid var(--line);z-index:20;display:flex;flex-direction:column;box-shadow:12px 0 32px rgba(0,0,0,.35)}
.drawer-head{display:flex;align-items:center;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.drawer-head strong{flex:1;font-family:var(--f-display);font-size:14px;letter-spacing:.04em}
#newChat2{width:calc(100% - 24px);margin:12px;background:var(--core);color:var(--bg);border:0;border-radius:10px;padding:10px;font-family:var(--f-display);font-size:13px;cursor:pointer}
#chatList{flex:1;overflow-y:auto;padding:0 8px 12px;display:flex;flex-direction:column;gap:2px}
.chat-item{display:flex;align-items:center;gap:6px;border-radius:8px}
.chat-item button.open{flex:1;min-width:0;background:none;border:0;color:var(--fg);text-align:left;padding:9px 10px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item button.open .when{display:block;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.chat-item:hover,.chat-item.active{background:var(--user)}
.chat-item button.del{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px 8px;border-radius:6px;font-size:14px}
.chat-item button.del:hover{color:var(--warn)}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15}
/* картинки */
.img-card{display:block;margin:8px 0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);cursor:pointer;max-width:340px;width:100%}
.img-card img{display:block;width:100%;height:auto;min-height:120px;background:var(--bg)}
.img-card .ph{width:100%;max-height:420px;background:var(--bg)}
.img-card .ph.loading{background:linear-gradient(100deg,var(--bg) 30%,var(--user) 50%,var(--bg) 70%);background-size:300% 100%;animation:shimmer 1.6s linear infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}
@media (prefers-reduced-motion:reduce){.img-card .ph.loading{animation:none}}
.img-card .again{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:5px 8px;font:inherit;font-size:12px;cursor:pointer;flex:none}
.img-card .cap{display:flex;gap:8px;align-items:center;padding:8px 10px;font-size:12px;color:var(--muted)}
.img-card .cap span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.img-view{height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
.img-view img{max-width:100%;max-height:100%;border-radius:10px}
.wiki-card{display:flex;gap:14px;align-items:flex-start;margin:4px 0 12px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;white-space:normal;max-width:620px}
.wiki-card .wk-img{flex:none;width:120px;cursor:pointer}
.wiki-card .wk-img img{width:120px;max-height:160px;object-fit:cover;border-radius:8px;display:block;background:var(--bg)}
.wiki-card.loading .wk-img{height:120px;border-radius:8px;background:linear-gradient(100deg,var(--bg) 30%,var(--user) 50%,var(--bg) 70%);background-size:300% 100%;animation:shimmer 1.6s linear infinite}
.wk-tx{min-width:0;display:flex;flex-direction:column;gap:4px}
.wk-tx strong{font-family:var(--f-display);font-size:16px;letter-spacing:.02em}
.wk-desc{color:var(--muted);font-size:13px}
.wk-ex{margin:2px 0 0;font-size:14px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.wk-links{display:flex;flex-wrap:wrap;gap:12px;font-size:13px}
.wk-links a{color:var(--core)}
@media (max-width:520px){.wiki-card{flex-direction:column}.wiki-card .wk-img,.wiki-card .wk-img img{width:100%;max-height:240px}}
.place-card{margin:8px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);max-width:560px;white-space:normal}
.place-card iframe{display:block;width:100%;height:240px;border:0;background:var(--bg)}
.pl-info{display:flex;flex-direction:column;gap:4px;padding:10px 12px}
.pl-meta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.where-btn{background:var(--core);color:var(--bg);border:0;border-radius:10px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;align-self:center}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:8px 0;max-width:560px}
.photos button{padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);cursor:pointer;display:flex;flex-direction:column}
.photos img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--bg)}
.photos .ps{font-size:11px;color:var(--muted);padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.photo-note{display:block;font-size:13px;color:var(--muted);margin:4px 0}
.photo-note a{color:var(--core)}
/* окно с кодом, как у Claude */
.code-chip{display:flex;align-items:center;gap:10px;margin:8px 0;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--fg);font:inherit;font-size:14px;cursor:pointer;text-align:left;width:100%;max-width:420px}
.code-chip:hover{border-color:var(--core-dim)}
.code-chip .ic{font-family:var(--f-mono);color:var(--core);border:1px solid var(--core-dim);border-radius:6px;padding:2px 6px;font-size:12px}
.code-chip .meta{color:var(--muted);font-size:12px;display:block}
.code-chip .nm{flex:1;min-width:0}
.code-chip .dl{margin-left:auto;background:var(--core);color:var(--bg);border:0;border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer;flex:none}
.file-view{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
.file-view .big{font-family:var(--f-mono);font-size:28px;color:var(--core);border:2px solid var(--core-dim);border-radius:14px;padding:18px 22px}
.file-view .fname{font-family:var(--f-mono);font-size:16px}
.file-view .fmeta{color:var(--muted);font-size:13px}
.file-view .run{font-family:var(--f-mono);font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--fg);max-width:100%;overflow-wrap:anywhere}
.file-view .dl2{background:var(--core);color:var(--bg);border:0;border-radius:10px;padding:10px 18px;font-family:var(--f-display);font-size:13px;cursor:pointer}
#pane{position:fixed;top:0;right:0;bottom:0;width:min(58vw,900px);background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:10;box-shadow:-12px 0 32px rgba(0,0,0,.35)}
@media (max-width:820px){#pane{width:100vw}}
body.pane-open .app{margin-right:min(58vw,900px);margin-left:max(0px,calc((100vw - min(58vw,900px) - 780px)/2))}
@media (max-width:820px){body.pane-open .app{margin:0 auto}}
.pane-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)}
.pane-title{flex:1;min-width:0;font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tabs button{background:none;border:0;color:var(--muted);padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--core-dim);color:var(--fg)}
.pane-body{flex:1;min-height:0;overflow:auto}
#errBar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#3a2414;color:var(--warn);font-size:13px;border-bottom:1px solid var(--line)}
#errText{flex:1;min-width:0;font-family:var(--f-mono);overflow-wrap:anywhere}
#fixBtn{color:var(--warn);border-color:var(--warn);flex:none}
.pane-body pre{margin:0;padding:14px 16px;font-family:var(--f-mono);font-size:13px;line-height:1.55;white-space:pre;tab-size:2}
.pane-body pre code.hljs{background:transparent;padding:0}
#preview{width:100%;height:100%;border:0;background:#fff;display:block}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
<div class="app">
  <header>
    <button class="btn" id="chatsBtn" aria-expanded="false"></button>
    <h1 id="title">QWENTITY</h1>
    <button class="btn" id="newChat"></button>
    <span class="status" id="status"></span>
    <span class="health"><span id="hGem" title="Gemini">AI</span><span id="hImg" title="Images">IMG</span></span>
    <button class="btn" id="wake" aria-pressed="false"></button>
    <button class="btn" id="voice" aria-pressed="true"></button>
    <button class="btn" id="teachBtn" aria-pressed="false"></button>
    <button class="btn" id="setBtn" aria-expanded="false"></button>
  </header>

  <section id="settings" hidden>
    <label for="key"><span><span data-t="keyLabel"></span> <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a></span>
      <input id="key" type="password" autocomplete="off" placeholder="AIza… / AQ.…">
    </label>
    <label class="chk" for="gimg"><input id="gimg" type="checkbox"> <span data-t="gimgLabel"></span></label>
    <div class="row">
      <label for="pkey"><span><span data-t="pkeyLabel"></span> <a href="https://enter.pollinations.ai" target="_blank" rel="noopener">enter.pollinations.ai</a></span>
        <input id="pkey" type="password" autocomplete="off" placeholder="sk_… (optional)">
      </label>
      <label for="hkey"><span><span data-t="hkeyLabel"></span> <a href="https://aihorde.net/register" target="_blank" rel="noopener">aihorde.net</a></span>
        <input id="hkey" type="password" autocomplete="off" placeholder="optional">
      </label>
    </div>
    <div class="row">
      <label for="lang"><span data-t="langLabel"></span>
        <select id="lang">
          <option value="ru-RU">Русский</option>
          <option value="fr-FR">Français</option>
          <option value="en-US">English</option>
          <option value="it-IT">Italiano</option>
          <option value="de-DE">Deutsch</option>
        </select>
      </label>
      <label for="board"><span data-t="boardLabel"></span>
        <select id="board">
          <option value="">Auto</option>
          <option value="uno">Arduino Uno</option>
          <option value="nano">Arduino Nano</option>
          <option value="mega">Arduino Mega</option>
          <option value="esp32">ESP32</option>
          <option value="esp8266">ESP8266 (NodeMCU / Wemos)</option>
          <option value="kniwwelino">Kniwwelino (ESP8266)</option>
          <option value="pico">Raspberry Pi Pico (MicroPython)</option>
          <option value="microbit">micro:bit (MicroPython)</option>
        </select>
      </label>
    </div>
    <div class="row">
      <label for="model"><span data-t="modelLabel"></span>
        <select id="model"><option value="gemini-flash-latest">gemini-flash-latest</option></select>
      </label>
    </div>
    <label for="about"><span data-t="aboutLabel"></span>
      <textarea id="about"></textarea>
    </label>
  </section>

  <main id="log" aria-live="polite">
  </main>

  <div class="mic-zone">
    <button id="mic"></button>
    <div class="mic-langs" role="group" aria-label="Speech language">
      <button type="button" data-l="en-US">EN</button><button type="button" data-l="ru-RU">RU</button><button type="button" data-l="fr-FR">FR</button><button type="button" data-l="de-DE">DE</button><button type="button" data-l="it-IT">IT</button>
    </div>
    <div id="interim"></div>
    <div id="tray" hidden></div>
    <form class="text-row" id="form">
      <button id="attachBtn" type="button" title="Attach photo or file">📎</button>
      <input id="fileIn" type="file" multiple hidden accept="image/*,.pdf,.txt,.md,.py,.ino,.c,.cpp,.h,.hpp,.js,.ts,.html,.css,.json,.csv,.xml,.yml,.yaml,.sh,.log">
      <input id="q">
      <button id="send" type="submit"></button>
    </form>
  </div>
</div>

<div id="scrim" hidden></div>
<nav id="drawer" hidden>
  <div class="drawer-head"><strong id="chatsTitle"></strong><button class="btn" id="drawerClose" aria-label="Close">✕</button></div>
  <button id="newChat2" type="button"></button>
  <div id="chatList"></div>
  <div class="drawer-foot">
    <button class="btn" id="exportBtn" type="button"></button>
    <button class="btn" id="importBtn" type="button"></button>
    <input id="importFile" type="file" accept=".json,application/json" hidden>
    <span id="importNote"></span>

// Определяем язык текста: en / ru / fr / de / it
function detectLang(s){
  s=" "+String(s||"").toLowerCase()+" ";
  if(/[а-яё]/.test(s)) return "ru";
  const score={en:0,fr:0,de:0,it:0};
  if(/[äöüß]/.test(s)) score.de+=3;
  if(/[òì]/.test(s)) score.it+=2;
  if(/[çœêëîïûÿ]|[àâ](?!\w*[òì])/.test(s)) score.fr+=2;
  const W={en:/\b(the|and|is|are|what|how|you|please|can|make|create|show|with|for|this)\b/g,
           fr:/\b(le|la|les|des|est|je|tu|vous|pour|avec|une|bonjour|merci|comment|fais|montre|quoi|qui|c'est|pourquoi)\b/g,
           de:/\b(der|die|das|und|ist|ich|du|nicht|bitte|mit|ein|eine|wie|was|warum|zeig|mach)\b/g,
           it:/\b(il|che|non|sono|perché|della|ciao|grazie|questo|una|fammi|mostrami|cosa|come si)\b/g};
  for(const k in W) score[k]+=((s.match(W[k])||[]).length);
  let best="en",bv=0; for(const k in score) if(score[k]>bv){ best=k; bv=score[k]; }
  return best;
}

async function loadModels(){
  const key=$("key").value.trim(); if(!key) return;
  try{
    const r=await fetch(API+"/models?pageSize=200",{headers:{"x-goog-api-key":key}});
    if(!r.ok) return;
    const j=await r.json();
    const names=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent"))
      .map(m=>m.name.replace("models/","")).filter(n=>/^gemini/.test(n)&&!/(tts|image|live|embed|audio|robotics|computer)/.test(n));
    if(!names.length) return;
    const score=n=>(/flash/.test(n)?100:0)-(/lite/.test(n)?50:0)+(parseFloat((n.match(/gemini-(\d+(\.\d+)?)/)||[0,0])[1])*10)+(/latest/.test(n)?5:0);
    names.sort((a,b)=>score(b)-score(a));
    const sel=$("model"), saved=S.get("jv-model");
    sel.innerHTML=""; names.forEach(n=>{ const o=document.createElement("option"); o.value=o.textContent=n; sel.append(o); });
    sel.value = names.includes(saved) ? saved : names[0];
  }catch(e){}
}

function speak(text){

    speechSynthesis.cancel();
    text=text.replace(/^\s*\|?\s*:?-{2,}.*$/gm,"").replace(/^\s*(---|\*\*\*)\s*$/gm,"");

const photoCache={};
async function searchPhotos(q){
  if(photoCache[q]) return photoCache[q];
  const out=[];
  const qs=[q]; const wq=q.split(/\s+/); if(wq.length>3) qs.push(wq.slice(0,3).join(" ")); if(wq.length>2) qs.push(wq.slice(0,2).join(" "));
  for(const qq of qs){ if(out.length>=4) break;
  try{
    const u="https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=8&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=800&gsrsearch="+encodeURIComponent(qq+" filetype:bitmap");
    const j=await (await fetch(u)).json();
    Object.values((j.query&&j.query.pages)||{}).sort((a,b)=>(a.index||0)-(b.index||0)).forEach(pg=>{
      const ii=(pg.imageinfo||[])[0]; if(!ii) return;
      if(out.some(o=>o.page===ii.descriptionurl)) return;
      out.push({thumb:ii.thumburl||ii.url,full:ii.thumburl||ii.url,page:ii.descriptionurl,source:"Wikimedia Commons",title:(pg.title||"").replace(/^File:/,"").replace(/\.\w+$/,"")});
    });
  }catch(e){}
  }
  if(out.length<4){
    try{
      const j=await (await fetch("https://api.openverse.org/v1/images/?page_size=8&q="+encodeURIComponent(q))).json();
      (j.results||[]).forEach(r=>out.push({thumb:r.thumbnail||r.url,full:r.url,page:r.foreign_landing_url||r.url,source:r.source||"Openverse",title:r.title||q}));
    }catch(e){}
  }
  photoCache[q]=out.slice(0,8);

}

async function fetchBlob(url, opts, timeout, w){

async function makeImage(p, box){

  let order=["geminiImg","pollinationsKey","pollinations","horde"].filter(n=>IMG_PROVIDERS[n].when());
  const pref=S.get("jv-imgprov");      // сначала тот сервис, который сработал в прошлый раз
  if(pref&&!/geminiImg|pollinationsKey/.test(pref)&&order.includes(pref)&&!$("pkey").value.trim()&&!$("gimg").checked) order=[pref,...order.filter(n=>n!==pref)];
  const errs=[];
  for(const name of order){
    const prov=IMG_PROVIDERS[name], st=step("picture · "+prov.label, box);
    try{
      const r=await prov.run(p, d=>st.info(d));
      st.done(); S.set("jv-imgprov",name);
      if(r.blob){ imgDB.put(k,{blob:r.blob,provider:prov.label}); return {src:URL.createObjectURL(r.blob),provider:prov.label}; }
      return {src:r.url,provider:prov.label};
    }catch(e){ const m=String((e&&e.message)||e).slice(0,90); st.fail(m); errs.push(prov.label+": "+m); }
  }
  const hint=($("gimg").checked||$("pkey").value.trim())?"":" — Free picture services are overloaded. For reliable pictures open Settings: turn on “Gemini pictures” or add a Pollinations key.";
  throw new Error(errs.join(" · ")+hint);
}

  const parts=[]; const re=/```([\w+#.-]*)[ \t]*([^\n]*)\n([\s\S]*?)(```|$)/g; let last=0,m;
  while((m=re.exec(text))){ if(m.index>last) parts.push({type:"text",text:text.slice(last,m.index)}); { const lang=(m[1]||"text").toLowerCase();
    if(lang==="photo"){ parts.push({type:"photo",query:m[3].trim().split("\n")[0]}); last=re.lastIndex; continue; }
    if(lang==="wiki"){ const ln=m[3].trim().split("\n"), tt=ln[0].replace(/^["']|["']$/g,"").trim(); if(tt) parts.push({type:"wiki",title:tt,ctx:(ln[1]||"").replace(/^context:\s*/i,"").trim()}); last=re.lastIndex; continue; }
    if(lang==="place"){ const pl=parsePlace(m[3]); if(pl) parts.push(Object.assign({type:"place"},pl)); last=re.lastIndex; continue; }
    if(lang==="image"){ const seed=((m[2].match(/seed=(\d+)/)||[])[1])||"1"; const size=((m[2].match(/size=(square|wide|tall)/)||[])[1])||"square"; const pr=m[3].trim().replace(/\s+/g," "); parts.push({type:"image",lang:"image",prompt:pr,code:pr,seed,size,url:"",name:"qwentity-"+seed+".jpg"}); last=re.lastIndex; continue; }
    const nm=(m[2].match(/[\w.-]+\.[a-z0-9]{1,5}/i)||[])[0]; parts.push({type:"code",lang,code:m[3].replace(/\n$/,""),name:nm||("qwentity."+(EXT[lang]||"txt"))}); } last=re.lastIndex; }
  if(last<text.length) parts.push({type:"text",text:text.slice(last)});

}

    let i; while((i=buf.indexOf("\n"))>=0){ eat(buf.slice(0,i)); buf=buf.slice(i+1); } }

      // 404 (нет такой модели) — сразу к следующей модели
      if(res.status===404) break;
      lastErr=res.msg;
      if(res.status!==429&&res.status!==400) break;
    }
  }
  throw new Error(lastErr+" | tried: "+tried.join(", "));
}

// Второй проход: Qwentity сам проверяет и улучшает свой код
const REVIEW="Act as a strict senior engineer reviewing the code you just wrote. Mentally run it line by line. Find and fix: syntax errors, runtime errors, undefined variables, missing imports, logic bugs, unfinished parts, anything from my request that is missing or done poorly, bad UX or ugly design, edge cases. Then improve it further so it is clearly better. "+
  "Output ONLY the complete improved answer in the same structure and language as before: keep every section (parts, wiring table, libraries, upload steps) and give the COMPLETE final version of EVERY file, each in its own fenced block with the same language and file name on the opening line. No diff, no list of changes.";
// ---------- индикатор: что работает, а что нет ----------
let TRACE=null;
function health(id,state,title){ const e=$(id); if(!e) return; e.className=state; if(title) e.title=title; }
function step(label,box){
  box=box||TRACE; const t0=performance.now();
  if(!box) return {done(){},fail(){},info(){}};
  const s=document.createElement("span"); s.className="run"; s.textContent="… "+label; box.append(s);
  const sec=()=>((performance.now()-t0)/1000).toFixed(1)+"s";
  return { info(d){ s.textContent="… "+label+" — "+d; },
           done(d){ s.className="ok"; s.textContent="✓ "+label+" "+(d||sec()); },
           fail(d){ s.className="err"; s.textContent="✗ "+label+" "+(d||""); } };
}
// Если явно просили картинку, а блока ```image нет — сами составляем описание и рисуем
const WANT_IMG=/(нарису|сгенерир|создай (мне )?(картин|изображ|рисун|фото)|сделай (мне )?(картин|изображ|рисун)|картинк|draw|generate (an? )?(image|picture)|create (an? )?(image|picture)|make (an? )?(image|picture)|image of|picture of|dessine|crée une image|génère une image|disegna|crea un'?immagine|genera un'?immagine|zeichne|erstelle ein bild|generiere ein bild)/i;
function hasPic(text){ return splitAnswer(text).some(p=>p.type==="image"||p.type==="photo"); }
async function forceImage(key, signal, question){
  const ask=[{role:"user",parts:[{text:"Write ONE English prompt (25–60 words) for an AI image generator for this request: \""+question+"\". "+
    "One clear subject, exact art style, setting, lighting, colours, camera angle, end with 'no text'. If it shows a real, identifiable person, use a clearly illustrated style (cartoon, caricature, comic or painting), not photorealistic. Reply with ONLY the prompt."}]}];
  const j=await generate(key, signal, null, ask, [false]);
  const cand=(j.candidates||[])[0]||{};
  let pr=((cand.content&&cand.content.parts)||[]).filter(p=>p.text&&!p.thought).map(p=>p.text).join(" ").trim().replace(/^```\w*|```$/g,"").replace(/\s+/g," ").replace(/^["']|["']$/g,"");
  if(pr.length<15||/(I can'?t|I cannot|I'm unable|не могу|je ne peux|non posso|ich kann nicht)/i.test(pr)) return null;
  return pr;
}
// Запасной вариант без Gemini: берём сам запрос
function localPrompt(q){
  const s=q.replace(/^(please\s+)?(create|make|generate|draw|show me)\s+(me\s+)?(an?\s+)?(image|picture|drawing|photo)?\s*(of\s+)?/i,"")
           .replace(/^(нарисуй|сгенерируй|создай|сделай)\s+(мне\s+)?(картинку|изображение|рисунок)?\s*/i,"");
  return s.trim()+", colorful cartoon illustration, clean composition, soft lighting, no text";
}
function streamPreview(s){
  s=s.replace(/```(wiki|place)[^`]*?(```|$)/g,"");
  return s.replace(/```(\w*)[ \t]*([^\n]*)\n[\s\S]*?```/g,(m,l,n)=> l==="image"?"[🎨 picture]":l==="photo"?"[🖼 photos]":"[📄 "+(n||l||"code")+"]")
          .replace(/```(\w*)[ \t]*([^\n]*)\n?([\s\S]*)$/,(m,l,n,b)=> (l==="image"||l==="photo")?"…":"[⏳ "+t("writing")+" "+(n||l||"code")+" · "+b.split("\n").length+" "+t("lines")+"…]");
}
// «Кто такой Эйнштейн?» → ищем карточку в Википедии, даже если модель её не добавила
function whoIs(q){
  const m=String(q).trim().match(/^(?:who (?:is|was)|what (?:is|was) (?:a |an |the )?|tell me about|кто так(?:ой|ая|ие)|кто был[аи]?|что такое|расскажи (?:мне )?(?:про|о)|qui (?:est|était)|qu'est-ce que|wer (?:ist|war)|was ist|chi (?:è|era)|cos'è|che cos'è)\s+(.{2,60}?)[\s?!.]*$/i);
  if(!m) return null; const s=m[1].trim(); if(s.split(/\s+/).length>6) return null; return s;
}
function hasCode(text){ return splitAnswer(text).some(p=>p.type==="code"); }
async function reviewCode(key, signal, answer){
  const contents=[...apiTurns(), {role:"model",parts:[{text:answer}]}, {role:"user",parts:[{text:REVIEW}]}];
  const j=await generate(key, signal, null, contents, [false]);
  const cand=(j.candidates||[])[0]||{};
  const better=((cand.content&&cand.content.parts)||[]).filter(p=>p.text&&!p.thought).map(p=>p.text).join("").trim();
  const finished=cand.finishReason!=="MAX_TOKENS";
  return (better&&hasCode(better)&&finished) ? better : null;
}

// ---------- вложения: фото, PDF, текстовые файлы ----------
let pending=[];
const TEXT_EXT=/\.(txt|md|py|ino|c|cpp|h|hpp|js|ts|html|css|json|csv|xml|ya?ml|sh|log)$/i;
function toB64(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=()=>rej(r.error); r.readAsDataURL(blob); }); }
async function shrinkImage(file,max){
  const bmp=await createImageBitmap(file);
  const k=Math.min(1,max/Math.max(bmp.width,bmp.height)), w=Math.round(bmp.width*k), hh=Math.round(bmp.height*k);
  const cv=document.createElement("canvas"); cv.width=w; cv.height=hh; cv.getContext("2d").drawImage(bmp,0,0,w,hh); bmp.close&&bmp.close();
  const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.85));
  return {data:await toB64(blob),mime:"image/jpeg",url:URL.createObjectURL(blob)};
}
function trayNote(msg){ interim.textContent=msg; setTimeout(()=>{ if(interim.textContent===msg) interim.textContent=""; },6000); }
async function addFiles(list){
  for(const f of [...list]){
    if(pending.length>=6) break;
    try{
      if(/^image\//.test(f.type)){ const meta=await readExif(f); const r=await shrinkImage(f,1600); pending.push({kind:"image",name:f.name||"photo.jpg",mime:r.mime,data:r.data,thumb:r.url,meta}); }
      else if(f.type==="application/pdf"||/\.pdf$/i.test(f.name)){ if(f.size>15e6){ trayNote(t("tooBig")+" "+f.name); continue; } pending.push({kind:"pdf",name:f.name,mime:"application/pdf",data:await toB64(f)}); }
      else if(TEXT_EXT.test(f.name)||/^text\//.test(f.type)){ if(f.size>400000){ trayNote(t("tooBig")+" "+f.name); continue; } pending.push({kind:"text",name:f.name,text:await f.text()}); }
      else trayNote(t("badType")+" "+f.name);
    }catch(e){ trayNote(f.name+": "+String((e&&e.message)||e)); }
  }
  paintTray(); paintSend();
}
function attChip(a,removable){
  const d=document.createElement("div"); d.className="att";
  if(a.kind==="image"&&a.thumb){ const im=document.createElement("img"); im.src=a.thumb; im.alt=a.name; d.append(im); }
  else { const ic=document.createElement("div"); ic.className="ic2"; ic.textContent=a.kind==="pdf"?"PDF":"."+(a.name.split(".").pop()||"txt"); d.append(ic); }
  const s=document.createElement("span"); s.textContent=a.name; d.append(s);
  if(removable){ const x=document.createElement("button"); x.type="button"; x.textContent="✕"; x.setAttribute("aria-label","Remove "+a.name); x.onclick=()=>{ pending=pending.filter(p=>p!==a); paintTray(); paintSend(); }; d.append(x); }
  return d;
}
function paintTray(){ const tr=$("tray"); tr.textContent=""; pending.forEach(a=>tr.append(attChip(a,true)));
  if(pending.some(a=>a.kind==="image")){ const w=document.createElement("button"); w.type="button"; w.className="where-btn"; w.textContent="📍 "+t("whereBtn"); w.onclick=()=>{ $("q").value=""; ask(t("whereQ")); }; tr.append(w); }
  tr.hidden=!pending.length; }
$("attachBtn").onclick=()=>$("fileIn").click();
$("fileIn").onchange=e=>{ addFiles(e.target.files); e.target.value=""; };
document.addEventListener("paste",e=>{ const fs=[...((e.clipboardData&&e.clipboardData.files)||[])]; if(fs.length){ e.preventDefault(); addFiles(fs); } });
let dragDepth=0;
window.addEventListener("dragenter",e=>{ if(e.dataTransfer&&[...e.dataTransfer.types].includes("Files")){ dragDepth++; document.body.classList.add("dragging"); } });
window.addEventListener("dragleave",()=>{ dragDepth=Math.max(0,dragDepth-1); if(!dragDepth) document.body.classList.remove("dragging"); });
window.addEventListener("dragover",e=>{ if(e.dataTransfer&&[...e.dataTransfer.types].includes("Files")) e.preventDefault(); });
window.addEventListener("drop",e=>{ if(!e.dataTransfer||!e.dataTransfer.files.length) return; e.preventDefault(); dragDepth=0; document.body.classList.remove("dragging"); addFiles(e.dataTransfer.files); });

async function ask(question){
  const key=$("key").value.trim();
  if(!key){ addMsg("j err",t("jarvis"),t("needKey")); $("settings").hidden=false; return; }
  // новый вопрос важнее старого: прерываем то, что ещё идёт
  if(reqCtl){ reqCtl.abort(); }
  stopSpeaking();
  if(rec) stopRec();
  const ctl=new AbortController(); reqCtl=ctl;
  const timer=setTimeout(()=>ctl.abort("timeout"),300000);
  busy=true;
  log.querySelectorAll(".intro").forEach(e=>e.remove());
  const files=pending; pending=[]; paintTray();
  if(!question&&files.length) question=t("lookAtThis");
  const um=addMsg("u",t("you"),question);
  if(files.length){ const box=document.createElement("div"); box.className="atts"; files.forEach(a=>box.append(attChip(a,false))); um.append(box); }
  let fullText=question;
  const gpsPhotos=[];
  for(const a of files.filter(x=>x.kind==="image"&&x.meta)){
    const m=a.meta, bits=[];
    if(m.lat!=null){ const addr=await reverseGeocode(m.lat,m.lon); gpsPhotos.push({lat:m.lat,lon:m.lon,addr,name:a.name}); bits.push("GPS "+m.lat+", "+m.lon+(addr?" ("+addr+")":"")); }
    if(m.date) bits.push("taken "+m.date); if(m.make||m.model) bits.push("camera "+[m.make,m.model].filter(Boolean).join(" "));
    if(bits.length) fullText+="\n\n[Metadata of photo "+a.name+": "+bits.join("; ")+"]";
  }
  files.filter(a=>a.kind==="text").forEach(a=>{ fullText+="\n\nFile "+a.name+":\n```\n"+a.text.slice(0,200000)+"\n```"; });
  const turn={role:"user",parts:[{text:fullText},...files.filter(a=>a.kind!=="text").map(a=>({inlineData:{mimeType:a.mime,data:a.data},_name:a.name}))]};
  if(files.length) turn._display=question+"\n"+files.map(a=>"📎 "+a.name).join("  ");
  const thisChat=cur();
  thisChat.turns.push(turn); thisChat.updated=Date.now();
  if(!thisChat.title) thisChat.title=question.slice(0,48);
  saveChats();
  const out=addMsg("j",t("jarvis"),t("think")); mic.classList.add("busy"); setStatus("thinking");
  const tr=document.createElement("div"); tr.className="trace"; out.append(tr); TRACE=tr;
  let answer="", streamed="";
  const bodyEl=out.querySelector(".body");
  try{
    const j=await generate(key, ctl.signal, out, undefined, undefined, txt=>{
      if(reqCtl!==ctl) return;
      streamed=txt; bodyEl.textContent=streamPreview(txt);
      const nearBottom=log.scrollHeight-log.scrollTop-log.clientHeight<120; if(nearBottom) log.scrollTop=log.scrollHeight;
      if(statusKey!=="writing") setStatus("writing");
    });
    const cand=(j.candidates||[])[0]||{};
    answer=((cand.content&&cand.content.parts)||[]).filter(p=>p.text&&!p.thought).map(p=>p.text).join("").trim();
    if(!answer) throw new Error("EMPTY");
    if(WANT_IMG.test(question)&&!hasPic(answer)){
      const st=step("image prompt"); let pr=null;
      try{ pr=await forceImage(key, ctl.signal, question); }
      catch(e){ if(reqCtl!==ctl) throw e; }
      if(pr) st.done(); else { st.fail("→ fallback"); pr=localPrompt(question); }
      answer=answer+"\n\n```image size=square\n"+pr+"\n```";
    }
    if(gpsPhotos.length&&!/```place/.test(answer)){ const g=gpsPhotos[0]; answer+="\n\n```place\n"+g.lat+", "+g.lon+" | "+(g.addr?g.addr.split(",").slice(0,3).join(","):g.name)+" | high | photo GPS\n```"; }
    if(!/```wiki/.test(answer)){ const wt=whoIs(question); if(wt) answer="```wiki\n"+wt+"\n```\n"+answer; }
    answer=addSeeds(answer);
    renderAnswer(out.querySelector(".body"), answer, true, question);
    if(hasCode(answer)&&!teach){
      // показываем первую версию, а пока Qwentity проверяет и улучшает код
      setStatus("improving");
      const note=document.createElement("span"); note.className="src"; note.textContent=t("improving"); out.append(note);
      try{
        const better=await reviewCode(key, ctl.signal, answer);
        if(better){ answer=addSeeds(better); renderAnswer(out.querySelector(".body"), answer, true, question); note.textContent=t("improved"); }
        else note.remove();
      }catch(e){ if(reqCtl!==ctl) throw e; note.remove(); }
    }
    const chunks=(cand.groundingMetadata&&cand.groundingMetadata.groundingChunks)||[];
    if(chunks.length){
      const s=document.createElement("span"); s.className="src"; s.append(t("sources")+" ");
      chunks.slice(0,4).forEach((c,i)=>{ if(!c.web) return; const a=document.createElement("a"); a.href=c.web.uri; a.target="_blank"; a.rel="noopener"; a.textContent=c.web.title||("link "+(i+1)); s.append(a," "); });
      out.append(s);
    }
    thisChat.turns.push({role:"model",parts:[{text:answer}]}); thisChat.updated=Date.now(); saveChats();
    log.scrollTop=log.scrollHeight;
  }catch(e){
    const i=thisChat.turns.indexOf(turn); if(i>=0){ thisChat.turns.splice(i,1); saveChats(); }
    if(reqCtl!==ctl){ out.remove(); clearTimeout(timer); return; }   // заменён новым вопросом
    out.classList.add("err");
    let m=String((e&&e.message)||e);
    const raw=m;
    if(ctl.userStop){ out.classList.remove("err"); m=(streamed?streamPreview(streamed)+"\n\n":"")+"■ "+t("stopped"); health("hGem","ok"); }
    else if(e&&e.name==="AbortError"||m==="timeout") m="Stopped: no answer from Google for 5 minutes. Try again or ask a shorter question.";
    else if(m==="EMPTY") m=t("empty");
    else if(/API key|API_KEY/i.test(m)) m=t("badKey");
    else if(/quota|RESOURCE_EXHAUSTED|429/i.test(m)) m=t("quota")+"\n\n(Google: "+m.slice(0,300)+")";
    else if(/NETWORK|Failed to fetch|NetworkError|Load failed/i.test(m)){
      m = !navigator.onLine ? t("offline")
        : (window.self!==window.top) ? "Can’t reach Google from inside a preview. Download qwentity.html and open it in Chrome."
        : /neocities\.org$/i.test(location.hostname) ? "Neocities free plan blocks this: free Neocities sites are not allowed to call other websites’ APIs (Google, Wikimedia). Host the file on GitHub Pages, Netlify or Cloudflare Pages instead (free), or use Neocities Supporter."
        : "Couldn’t reach Google (network error). Check Wi-Fi, VPN, ad-blocker or school firewall, then try again.\n\n(details: "+raw.replace(/^NETWORK: /,"").slice(0,160)+")";
      health("hGem","err","Network error");
    }
    out.querySelector(".body").textContent=m;
  }finally{
    clearTimeout(timer);
  }
  if(reqCtl!==ctl) return;
  reqCtl=null; busy=false; mic.classList.remove("busy");
  if(answer){ setStatus("speaking"); await speak(answer); }
  if(reqCtl||rec) return;
  setStatus(wakeOn?"waiting":"ready");
  if(wakeOn) startWake();
}
$("q").addEventListener("input",paintSend);
$("form").addEventListener("submit",e=>{ e.preventDefault(); const v=$("q").value.trim();
  if(!v&&pending.length){ ask(""); return; }
  if(!v){ if(reqCtl){ reqCtl.userStop=true; reqCtl.abort(); } else { stopSpeaking(); setStatus(wakeOn?"waiting":"ready"); } return; }
  if(v){ $("q").value=""; if(v.split(/\s+/).length>=3) setMicLang(SPEECH[detectLang(v)]); ask(v); } });

// ---------- распознавание речи ----------
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null, mode=null, wakeOn=false;
if(!SR){ mic.disabled=true; }

function newRec(continuous){ const r=new SR(); r.lang=$("lang").value; r.interimResults=true; r.continuous=continuous; return r; }
function stopRec(){ if(rec){ rec.onend=null; try{rec.abort()}catch(e){} rec=null; } mic.classList.remove("listening"); }

function listenOnce(){
  stopRec(); stopSpeaking(); mode="ask";
  rec=newRec(false); let finalText="";
  rec.onstart=()=>{ mic.classList.add("listening"); setStatus("listening"); interim.textContent=t("speak"); };
  rec.onresult=e=>{ let s=""; for(const res of e.results){ s+=res[0].transcript; if(res.isFinal) finalText=s; } interim.textContent=s; };
  rec.onerror=e=>{ interim.textContent = (e.error==="not-allowed"||e.error==="service-not-allowed") ? t("denied") : e.error==="no-speech" ? t("noSpeech") : t("micErr")+e.error; };
  rec.onend=()=>{ mic.classList.remove("listening"); rec=null; if(finalText.trim()){ interim.textContent=""; ask(finalText.trim()); } else { setStatus(wakeOn?"waiting":"ready"); if(wakeOn) startWake(); } };
  try{ rec.start(); }catch(e){}
}
mic.onclick=()=>{ if(!SR) return; if(rec&&mode==="ask"){ rec.stop(); return; } stopSpeaking(); listenOnce(); };

const WAKE=/(qwentity|quentity|kwentity|quantity|qwentit\w*|квентити|квентитя|квантити|кьюэнтити|кви?ентити|quentita|quantità)[\s,.!?]*/i;
function startWake(){
  if(!wakeOn||!SR||busy||(rec&&mode==="ask")) return;
  stopRec(); mode="wake";
  rec=newRec(true); let fired=false;
  rec.onresult=e=>{
    for(let i=e.resultIndex;i<e.results.length;i++){
      const s=e.results[i][0].transcript, m=s.match(WAKE);
      if(m&&!fired){
        const rest=s.slice(m.index+m[0].length).trim();
        if(e.results[i].isFinal){
          fired=true; stopRec();
          if(rest.split(/\s+/).length>=2){ ask(rest); } else { speak(t("yes")).then(listenOnce); }
          return;
        } else { interim.textContent="Qwentity… "+rest; }
      }
    }
  };
  rec.onerror=e=>{ if(e.error==="not-allowed"||e.error==="service-not-allowed"){ wakeOn=false; paintWake(); interim.textContent=t("denied"); } };
  rec.onend=()=>{ rec=null; if(wakeOn&&!busy&&mode==="wake") setTimeout(startWake,300); };
  try{ rec.start(); setStatus("waiting"); }catch(e){}
}
function paintWake(){ $("wake").setAttribute("aria-pressed",wakeOn); $("wake").textContent=t("wake")+": "+t(wakeOn?"on":"off"); }
$("wake").onclick=()=>{ if(!SR) return; wakeOn=!wakeOn; paintWake(); if(wakeOn){ interim.textContent=t("wakeHint"); startWake(); } else { stopRec(); setStatus("ready"); interim.textContent=""; } };

applyLang();
paintMicLang();
renderChat();
loadModels();
let framed=false; try{ framed=window.self!==window.top; }catch(e){ framed=true; }
if(framed){ addMsg("j err",t("jarvis"),"⚠ Download this file and open it in Google Chrome or Edge. Inside a preview the microphone and the internet are blocked, so Ask can't work here."); }
</script>
